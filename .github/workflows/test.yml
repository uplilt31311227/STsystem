# V2 商用上線自動化測試關卡：單元測試 + 全檔語法檢查
# 不含 Playwright E2E（需要 Google 登入憑證，不適合在 CI 跑）。
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright（package-lock 鎖定版）尚不支援 ubuntu 26.04，固定版本
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm test 的情境測試會 import papaparse。package-lock.json 已進版控（2026-11-20），
      # 用 npm ci 依鎖定版本安裝，測試環境可重現。--ignore-scripts 避免安裝時跑套件腳本
      # （E2E 不在此 workflow 跑）。
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      # npm test 內的 test-p9d-richdialog-dom 以 Playwright 開真 DOM（只用本機臨時埠，不連外），需要 Chromium。
      - name: Install Chromium for DOM tests
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Syntax check (src/js + scripts)
        run: npm run check
